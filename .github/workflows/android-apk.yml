name: WaysGram Android debug APK

on:
  # APK builds are manual-only. Source changes must not start a build implicitly.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waysgram-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    # A push-triggered run only acquires the concurrency lock to stop an older APK job.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout WaysGram and pinned Android sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Prepare pinned Telegram Android source and apply WaysGram overlays
        run: bash scripts/prepare-android-source.sh

      - name: Configure an isolated WaysGram development identity
        env:
          WAYSGRAM_API_BASE_URL: ${{ secrets.WAYSGRAM_API_BASE_URL }}
          WAYSGRAM_FIREBASE_CONFIG_JSON: ${{ secrets.WAYSGRAM_FIREBASE_CONFIG_JSON }}
          WAYSGRAM_REQUIRE_FIREBASE_CONFIG: "1"
        run: python3 scripts/prepare_android_dev_build.py --android-root android/telegram-upstream

      - name: Build universal debug APK
        working-directory: android/telegram-upstream
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verify package identity and APK signature
        shell: bash
        working-directory: android/telegram-upstream
        run: |
          APK="$(find TMessagesProj_App/build/outputs/apk -type f -path '*/afat/debug/*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='org.telegram.messenger.beta'"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify "$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/WaysGram-dev.apk"

      - name: Upload WaysGram debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WaysGram-android-debug
          path: dist/WaysGram-dev.apk
          if-no-files-found: error
          retention-days: 14
