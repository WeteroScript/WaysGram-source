name: WaysGram Android Java compile check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: waysgram-android-java-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-android-java:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout WaysGram and pinned Android sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Prepare pinned Android source and WaysGram overlays
        run: bash scripts/prepare-android-source.sh

      - name: Configure WaysGram source for compilation
        env:
          WAYSGRAM_API_BASE_URL: ${{ secrets.WAYSGRAM_API_BASE_URL }}
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          WAYSGRAM_REQUIRE_FIREBASE_CONFIG: "1"
        run: python3 scripts/prepare_android_dev_build.py --android-root android/telegram-upstream

      - name: Compile Android Java sources without assembling an APK
        working-directory: android/telegram-upstream
        run: |
          ./gradlew :TMessagesProj_App:compileAfatDebugJavaWithJavac \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
