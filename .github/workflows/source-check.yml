name: Android source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source preparation scripts
        run: |
          bash -n scripts/prepare-android-source.sh
          python -m py_compile scripts/apply-android-patches.py
          python -m py_compile scripts/prepare_android_dev_build.py

      - name: Verify pinned Android submodule
        shell: bash
        run: |
          test "$(git config -f .gitmodules --get submodule.android/telegram-upstream.path)" = "android/telegram-upstream"
          test "$(git config -f .gitmodules --get submodule.android/telegram-upstream.url)" = "https://github.com/DrKLO/Telegram.git"
          entry="$(git ls-tree HEAD android/telegram-upstream)"
          expected="3de37c8cfb039452be7398909461da6288babf15"
          [[ "$entry" == *"commit $expected"* ]]

      - name: Test GiftSheet source patcher
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify WaysGram Android overlay
        run: |
          for source in \
            WaysGramSessionStore.java \
            WaysGramAuthClient.java \
            WaysGramApiClient.java \
            WaysGramLoginSheet.java \
            WaysGramLoginFragment.java \
            WaysGramHomeFragment.java \
            WaysGramDirectoryFragment.java \
            WaysGramChatFragment.java \
            WaysGramTimelineFragment.java \
            WaysGramCloudDraftSync.java \
            WaysGramTypingIndicatorController.java \
            WaysGramSharedMediaFragment.java \
            WaysGramUserProfileFragment.java \
            WaysGramGiftCatalogClient.java \
            WaysGramGiftCatalogSheet.java \
            WaysGramBotsFragment.java \
            WaysGramBotDetailFragment.java \
            WaysGramBotChatFragment.java \
            WaysGramFirebaseConfig.java \
            WaysGramPushManager.java \
            WaysGramPushNotifications.java; do
            test -s "android/overlay/TMessagesProj/src/main/java/org/telegram/messenger/waysgram/$source"
          done
          grep -q 'patch_launch_source' scripts/apply-android-patches.py
          grep -q 'GET /api/telegram/gifts' docs/ANDROID_API_CONTRACT.md
          grep -q 'AuthWaysGram_bot' README.md
          grep -q 'https://bot-1793554244-6434-weterochina.bothost.tech' android/overlay/TMessagesProj/src/main/java/org/telegram/messenger/waysgram/WaysGramLoginSheet.java
          grep -q 'Для публичного канала укажите username' android/overlay/TMessagesProj/src/main/java/org/telegram/messenger/waysgram/WaysGramDirectoryFragment.java
          grep -q 'InputFilter.LengthFilter(6)' android/overlay/TMessagesProj/src/main/java/org/telegram/messenger/waysgram/WaysGramLoginSheet.java
          grep -q 'Название должно содержать не более 80 символов' android/overlay/TMessagesProj/src/main/java/org/telegram/messenger/waysgram/WaysGramDirectoryFragment.java
          grep -q 'new WaysGramBotsFragment()' android/overlay/TMessagesProj/src/main/java/org/telegram/messenger/waysgram/WaysGramHomeFragment.java
          grep -q 'TYPE_CONTACTS' android/overlay/TMessagesProj/src/main/java/org/telegram/messenger/waysgram/WaysGramHomeFragment.java
          grep -q 'TYPE_CONTACTS' android/overlay/TMessagesProj/src/main/java/org/telegram/messenger/waysgram/WaysGramDirectoryFragment.java
